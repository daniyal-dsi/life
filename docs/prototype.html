*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding-block:22px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
.tnum{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:var(--dw);letter-spacing:-.03em;line-height:.9}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:15px;color:var(--muted)}
.h1{margin:2px 0 0;font-family:var(--display);font-weight:var(--dw);font-size:34px;line-height:1;letter-spacing:-.02em;text-wrap:balance}
.sec{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--violet);color:var(--on-violet);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pillbtn{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px}
.card.tight{padding:16px}
.hero{background:var(--hero);color:var(--hero-text);border:1px solid var(--hero-line);border-radius:28px;padding:22px}
.hero .muted{color:var(--hero-muted)}
.kcard{background:var(--kb);color:var(--kf);border:1px solid var(--kl);border-radius:24px;padding:20px;display:block;width:100%}
.k-coral{--kb:var(--k-coral-bg);--kf:var(--k-coral-fg);--kn:var(--k-coral-num);--kbar:var(--k-coral-bar);--kbarfg:var(--k-coral-barfg);--ktr:var(--k-coral-track);--ki:var(--k-coral-icon);--kif:var(--k-coral-iconfg);--kl:var(--k-coral-line);--kg:var(--glow-coral)}
.k-green{--kb:var(--k-green-bg);--kf:var(--k-green-fg);--kn:var(--k-green-num);--kbar:var(--k-green-bar);--kbarfg:var(--k-green-barfg);--ktr:var(--k-green-track);--ki:var(--k-green-icon);--kif:var(--k-green-iconfg);--kl:var(--k-green-line);--kg:var(--glow-green)}
.k-sun{--kb:var(--k-sun-bg);--kf:var(--k-sun-fg);--kn:var(--k-sun-num);--kbar:var(--k-sun-bar);--kbarfg:var(--k-sun-barfg);--ktr:var(--k-sun-track);--ki:var(--k-sun-icon);--kif:var(--k-sun-iconfg);--kl:var(--k-sun-line);--kg:var(--glow-sun)}
.k-violet{--kb:var(--k-violet-bg);--kf:var(--k-violet-fg);--kn:var(--k-violet-num);--kbar:var(--k-violet-bar);--kbarfg:var(--k-violet-barfg);--ktr:var(--k-violet-track);--ki:var(--k-violet-icon);--kif:var(--k-violet-iconfg);--kl:var(--k-violet-line);--kg:var(--glow-violet)}
.knum{color:var(--kn);text-shadow:var(--kg)}
.kicon{width:40px;height:40px;border-radius:12px;background:var(--ki);color:var(--kif);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.kicon.sm{width:34px;height:34px;border-radius:10px}
.ktrack{height:8px;border-radius:4px;background:var(--ktr);overflow:hidden}
.kbar{height:100%;border-radius:4px;background:var(--kbar)}
.ktitle{font-family:var(--display);font-weight:700;font-size:19px}
.kpill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;background:var(--surface);color:var(--rose);font-weight:800;font-size:12px;border:1px solid var(--line)}
.seg{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:4px}
.seg button{height:44px;border-radius:20px;color:var(--muted);font-weight:600;font-size:14px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-text);font-weight:700}
.btn{height:56px;width:100%;border-radius:28px;background:var(--btn);color:var(--btn-text);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.coral{background:var(--coral);color:var(--on)}
.btn.green{background:var(--green);color:var(--on)}
.btn.violet{background:var(--violet);color:var(--on-violet)}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.danger{background:var(--rose-soft);color:var(--rose-ink)}
.btn.sm{height:46px;font-size:15px}
a.btn{text-decoration:none}
.quick{flex:1;height:48px;border-radius:24px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--on)}
.tile{border-radius:20px;padding:16px 14px;text-align:left}
.tile .disp{font-size:44px}
.tile .lbl{font-size:13px;font-weight:600;margin-top:8px}
.t-sun{background:var(--sun-soft)}.t-sun .lbl,.t-sun .sub{color:var(--sun-ink)}
.t-rose{background:var(--rose-soft)}.t-rose .lbl,.t-rose .sub{color:var(--rose-ink)}.t-rose .disp{color:var(--rose-ink)}
.t-green{background:var(--green-soft)}.t-green .lbl,.t-green .sub{color:var(--green-ink)}.t-green .disp{color:var(--green-ink)}
.t-violet{background:var(--violet-soft)}.t-violet .lbl,.t-violet .sub{color:var(--violet-ink)}
.t-coral{background:var(--coral-soft)}.t-coral .lbl,.t-coral .sub{color:var(--coral-ink)}
.nudge{display:flex;gap:12px;align-items:center;border-radius:20px;padding:14px 16px;width:100%;text-align:left}
.nudge .ic{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--on)}
.nudge .tt{font-size:15px;font-weight:700}
.nudge .sub{font-size:13px;margin-top:2px}
.badge-pr{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;background:var(--sun);color:var(--on);font-weight:800;font-size:13px;flex-shrink:0;box-shadow:var(--glow-sun)}
.pri{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-weight:800;font-size:11px;flex-shrink:0}
.pri.P1{background:var(--rose);color:var(--rose-on)}
.pri.P2{background:var(--p2-bg);color:var(--p2-ink)}
.pri.P3{border:1.5px solid var(--line2);color:var(--muted)}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}
.status.Blocked{background:var(--rose-soft);color:var(--rose-ink)}
.status.Done{background:var(--green-soft);color:var(--green-ink)}
.status.In{background:var(--violet-soft);color:var(--violet-ink)}
.status.Bk{background:var(--sun-soft);color:var(--sun-ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px 0}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--line)}
.stripe{width:8px;align-self:stretch;min-height:36px;border-radius:4px;flex-shrink:0}
.when{font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--chip);white-space:nowrap}
.when.late{background:var(--rose-soft);color:var(--rose-ink)}
.when.today{background:var(--sun-soft);color:var(--sun-ink)}
.check{width:32px;height:32px;border-radius:10px;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.check.on{background:var(--green);border-color:var(--green);color:var(--on)}
.bar{height:10px;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.setchip{height:34px;padding:0 12px;border-radius:10px;background:var(--chip);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.setchip.pr{background:var(--sun);color:var(--on);font-weight:800;padding-right:6px;box-shadow:var(--glow-sun)}
.setchip.pr b{height:22px;padding:0 7px;border-radius:7px;background:#16141F;color:#FFC83D;font-size:11px;display:inline-flex;align-items:center}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;width:100%}
.hist-body{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.dash{height:40px;padding:0 16px;border-radius:20px;border:1.5px dashed var(--line2);color:var(--muted);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.meal-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.meal-i{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px 4px 16px;font-size:15px}
.meal-sep{border-top:1px solid var(--line);margin-top:8px}
.xbtn{width:36px;height:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.addmini{height:32px;padding:0 12px;border-radius:16px;background:var(--green-soft);color:var(--green-ink);font-size:13px;font-weight:700}
.daycell{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.daycell span.sq{width:100%;max-width:40px;aspect-ratio:1;border-radius:12px;display:block}
.daycell[aria-pressed="true"]{color:var(--text);font-weight:800}

/* ---------- lookups & stats ---------- */
function ex(id){for(var i=0;i<S.lift.exercises.length;i++)if(S.lift.exercises[i].id===id)return S.lift.exercises[i];return null}
function exName(id){var e=ex(id);return e?e.name:'Removed exercise'}
function exGroup(id){var e=ex(id);return e?e.group:'core'}
function wVolume(w){var v=0;w.entries.forEach(function(e){e.sets.forEach(function(s){v+=s.w*s.r})});return v}
function wTitle(w){var g=[];w.entries.forEach(function(e){var k=exGroup(e.exId);if(g.indexOf(k)<0)g.push(k)});return g.slice(0,2).map(function(k){return GLABEL[k]}).join(' & ')||'Workout'}
function sortW(a,b){return a.date===b.date?(a.created||0)-(b.created||0):(a.date<b.date?-1:1)}

function liftStats(){
  var ws=S.lift.workouts.slice().sort(sortW),best={},prKeys={},prList=[];
  ws.forEach(function(w){w.entries.forEach(function(en){
    var mi=-1;en.sets.forEach(function(s,i){if(mi<0||s.w>en.sets[mi].w||(s.w===en.sets[mi].w&&s.r>en.sets[mi].r))mi=i});
    if(mi<0)return;var top=en.sets[mi],b=best[en.exId];
    if(b&&top.w>b.w){prKeys[w.id+'|'+en.exId+'|'+mi]=1;prList.push({wid:w.id,date:w.date,exId:en.exId,w:top.w,r:top.r,prev:b.w})}
    if(!b||top.w>b.w||(top.w===b.w&&top.r>b.r))best[en.exId]={w:top.w,r:top.r,date:w.date,wid:w.id};
  })});
  var t=today(),m0=monday(t),cnt={};
  ws.forEach(function(w){var k=monday(w.date);cnt[k]=(cnt[k]||0)+1});
  var thisWeek=ws.filter(function(w){return w.date>=m0&&w.date<=addDays(m0,6)});
  var streak=(cnt[m0]||0)>=3?1:0,k=addDays(m0,-7);
  while((cnt[k]||0)>=3){streak++;k=addDays(k,-7)}
  var bestStreak=streak;
  if(ws.length){var run=0,wk=monday(ws[0].date),guard=0;while(wk<=m0&&guard<600){guard++;if((cnt[wk]||0)>=3){run++;if(run>bestStreak)bestStreak=run}else if(wk!==m0)run=0;wk=addDays(wk,7)}}
  var ym=t.slice(0,7),month=ws.filter(function(w){return w.date.slice(0,7)===ym});
  var byGroup={},monthVol=0;
  month.forEach(function(w){w.entries.forEach(function(e){var g=exGroup(e.exId);e.sets.forEach(function(s){byGroup[g]=(byGroup[g]||0)+s.w*s.r;monthVol+=s.w*s.r})})});
  var weekVol=0;thisWeek.forEach(function(w){weekVol+=wVolume(w)});
  return{ws:ws,best:best,prKeys:prKeys,prList:prList,thisWeek:thisWeek,streak:streak,bestStreak:bestStreak,month:month,byGroup:byGroup,monthVol:monthVol,weekVol:weekVol,cnt:cnt,m0:m0};
}

function targets(p){
  var w=+p.weight||0,h=+p.height||0,a=+p.age||0;
  var bmr=10*w+6.25*h-5*a+(p.sex==='female'?-161:5);
  var f={sedentary:1.2,light:1.375,moderate:1.55,very:1.725}[p.activity]||1.2;
  var tdee=bmr*f,t=tdee;if(p.goal==='lose')t*=0.85;else if(p.goal==='gain')t*=1.1;
  t=Math.max(0,Math.round(t/5)*5);
  var protein=Math.round(w*2),fat=Math.round(t*0.25/9),carbs=Math.max(0,Math.round((t-protein*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:t,protein:protein,fat:fat,carbs:carbs};
}
function dayLog(d){return S.fuel.log.filter(function(l){return l.date===d})}
function sumLog(arr){var s={kcal:0,p:0,c:0,f:0};arr.forEach(function(l){s.kcal+=l.kcal*l.servings;s.p+=(l.p||0)*l.servings;s.c+=(l.c||0)*l.servings;s.f+=(l.f||0)*l.servings});return s}
function dayStatus(d,T){if(d>today())return'future';var a=dayLog(d);if(!a.length)return'none';return sumLog(a).kcal<=T.kcal?'ok':'over'}
function weightsSorted(){return S.fuel.weights.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}

function project(id){for(var i=0;i<S.work.projects.length;i++)if(S.work.projects[i].id===id)return S.work.projects[i];return null}
function bucket(id){for(var i=0;i<S.work.buckets.length;i++)if(S.work.buckets[i].id===id)return S.work.buckets[i];return null}
function person(id){for(var i=0;i<S.work.people.length;i++)if(S.work.people[i].id===id)return S.work.people[i];return null}
function personName(id){var p=person(id);return p?(id==='me'?p.name+' (you)':p.name):'Unassigned'}
function msOf(pid){return S.work.milestones.filter(function(m){return m.projectId===pid}).sort(function(a,b){return a.order-b.order})}
function priOf(m){var p=project(m.projectId);return p?p.priority:'P3'}
function workStats(){
  var t=today(),sun=addDays(monday(t),6),all=S.work.milestones,open=all.filter(function(m){return !m.done});
  return{open:open.length,
    p1:open.filter(function(m){return priOf(m)==='P1'}).length,
    p1Week:open.filter(function(m){return priOf(m)==='P1'&&m.due&&m.due<=sun}).length,
    dueWeek:open.filter(function(m){return m.due&&m.due>=t&&m.due<=sun}).length,
    dueToday:open.filter(function(m){return m.due===t}).length,
    overdue:open.filter(function(m){return m.due&&m.due<t}).length,
    done:all.filter(function(m){return m.done}).length,
    projects:S.work.projects.filter(function(p){return p.status!=='Done'}).length};
}
function bucketStats(bid){
  var ps=S.work.projects.filter(function(p){return p.bucketId===bid});
  var ms=S.work.milestones.filter(function(m){return ps.some(function(p){return p.id===m.projectId})});
  var open=ms.filter(function(m){return !m.done});
  var p1=open.filter(function(m){return priOf(m)==='P1'}).length;
  var next=open.filter(function(m){return m.due}).map(function(m){return m.due}).sort()[0];
  return{ps:ps,ms:ms,open:open.length,p1:p1,pct:ms.length?Math.round(100*(ms.length-open.length)/ms.length):0,next:next};
}
function projStats(pid){var ms=msOf(pid),done=ms.filter(function(m){return m.done}).length;return{ms:ms,done:done,total:ms.length,pct:ms.length?Math.round(100*done/ms.length):0,next:ms.filter(function(m){return !m.done})[0]}}

function hdr(eyebrow,title,right){return '<header class="top"><div style="min-width:0"><div class="eyebrow">'+esc(eyebrow)+'</div><h1 class="h1">'+esc(title)+'</h1></div>'+(right||'')+'</header>'}
function priBadge(p){return '<span class="pri '+p+'">'+(p==='P1'?bolt(10):'')+p+'</span>'}
function statusBadge(s){return '<span class="status '+(s==='In progress'?'In':s)+'">'+esc(s)+'</span>'}
function prBadge(){return '<span class="badge-pr">'+I('trophy',13,2.5)+'PR</span>'}
function effectiveDark(){var th=S.settings.theme;if(th==='dark')return true;if(th==='light')return false;if(hostTheme)return hostTheme==='dark';return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}

function lineChart(pts,opt){
  var W=320,H=opt.h||160,l=36,r=14,t=14,b=26;
  if(!pts.length)return '<div class="muted small" style="padding:24px 0;text-align:center">'+opt.empty+'</div>';
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  var st=opt.step||2.5,lo=Math.floor(mn/st)*st-st,hi=Math.ceil(mx/st)*st+st;if(hi-lo<st*3)hi=lo+st*3;
  var mid=lo+Math.round((hi-lo)/2/st)*st;
  function X(i){return pts.length===1?(l+(W-r))/2:l+(W-l-r)*i/(pts.length-1)}
  function Y(v){return t+(H-t-b)*(1-(v-lo)/(hi-lo))}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(opt.label)+'" style="display:block;max-width:100%">';
  [hi,mid,lo].forEach(function(v){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line)" stroke-width="1"/><text x="0" y="'+(Y(v)+4)+'" font-size="11" style="fill:var(--muted)">'+kg(v)+'</text>'});
  var d=pts.map(function(p,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ');
  if(pts.length>1)s+='<path d="'+d+' L'+X(pts.length-1).toFixed(1)+' '+(H-b)+' L'+X(0).toFixed(1)+' '+(H-b)+' Z" style="fill:'+opt.area+'"/>';
  s+='<path d="'+d+'" fill="none" style="stroke:'+opt.color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;
    if(p.hi)s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="7" style="fill:var(--sun);stroke:var(--surface)" stroke-width="2"/>';
    else s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="'+(last?5:4)+'" style="fill:'+opt.color+'"/>'});
  var idx=pts.length>2?[0,Math.floor((pts.length-1)/2),pts.length-1]:pts.map(function(_,i){return i});
  idx.forEach(function(i,n){var anc=pts.length===1?'middle':(i===0?'start':(i===pts.length-1?'end':'middle'));
    s+='<text x="'+X(i)+'" y="'+(H-6)+'" font-size="11" text-anchor="'+anc+'" style="fill:'+(i===pts.length-1?'var(--text)':'var(--muted)')+'"'+(i===pts.length-1?' font-weight="700"':'')+'>'+fmtShort(pts[i].date)+'</text>'});
  return s+'</svg>';
}

/* ---------- HOME ---------- */
function nudges(L,F,T){
  var out=[],t=today();
  if(!S.settings.reminders.nudges)return out;
  var n=L.thisWeek.length;
  if(n<3){var left=3-n,daysLeft=diffDays(addDays(L.m0,6),t)+1;
    out.push({tone:'sun',icon:'flame',a:'openWorkout',title:(L.streak>0?plural(left,'more workout')+' keeps your streak':plural(left,'more workout')+' starts a streak'),sub:n+' of 3 logged this week · '+plural(daysLeft,'day')+' left'});}
  var p1=S.work.milestones.filter(function(m){return !m.done&&priOf(m)==='P1'&&m.due&&diffDays(m.due,t)<=3}).sort(function(a,b){return a.due<b.due?-1:1})[0];
  if(p1){var p=project(p1.projectId),b=bucket(p.bucketId);out.push({tone:'rose',icon:'bolt',a:'goProject',id:p.id,title:p1.title+' · '+relDue(p1.due).toLowerCase(),sub:'P1 · '+p.name+' · '+(b?b.name:'')})}
  var od=S.work.milestones.filter(function(m){return !m.done&&m.due&&m.due<t}).length;
  if(od>1)out.push({tone:'rose',icon:'cal',a:'goWork',title:plural(od,'task')+' overdue',sub:'Tap to see them on your Work overview'});
  if(!dayLog(t).length&&new Date().getHours()>=12)out.push({tone:'green',icon:'apple',a:'openFood',title:'Nothing logged today',sub:'Add what you have eaten so far'});
  return out;
}

  var s='<div style="text-align:center"><div style="font-family:var(--display);font-weight:700;font-size:20px">'+esc(x.title)+'</div>'+(x.arabic?'<div class="arab dua-ar" lang="ar" dir="rtl" style="text-align:center">'+esc(x.arabic)+'</div>':'')+'</div>';
  s+='<button class="tasbih" data-a="dhikrTap" aria-label="Count one recitation. '+n+' so far"><svg viewBox="0 0 220 220" width="220" height="220" aria-hidden="true"><circle cx="110" cy="110" r="96" fill="none" stroke="var(--faith-soft)" stroke-width="14"/><circle cx="110" cy="110" r="96" fill="none" stroke="var(--gold)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(pc*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 110 110)"/></svg><span class="tasbih-n tnum">'+n+'</span><span class="tasbih-t">of '+tg+(n>=tg?' · done':'')+'</span></button>';
  s+='<div class="small muted" style="text-align:center;margin-top:-6px">Tap the circle for each recitation</div>';
  if(d.id==='free')s+='<div class="chips" style="justify-content:center">'+[33,100,313].map(function(v){return '<button class="fchip" data-a="dhikrTarget" data-v="'+v+'" aria-pressed="'+(tg===v)+'">'+v+'</button>'}).join('')+'</div>';
  return s+'<div class="grid2" style="gap:8px"><button class="btn ghost sm" data-a="dhikrMinus">−1</button><button class="btn ghost sm" data-a="dhikrReset">Reset today</button></div>'}
function sheetDua(d){var s=field('Title','<input id="duT" class="inp" data-bind="d.title" value="'+esc(d.title)+'" placeholder="e.g. Dua for healing">')+
    field('Category','<select id="duC" class="inp" data-bind="d.cat">'+opts(DUA_CATS.map(function(c){return[c[0],c[1]]}),d.cat)+'</select>')+
    field('Arabic','<textarea id="duA" class="inp arab" lang="ar" dir="rtl" data-bind="d.arabic" style="min-height:80px;font-size:22px">'+esc(d.arabic)+'</textarea>')+
    field('Transliteration','<textarea id="duR" class="inp" data-bind="d.translit" style="min-height:64px">'+esc(d.translit)+'</textarea>')+
    field('English meaning','<textarea id="duM" class="inp" data-bind="d.meaning" style="min-height:64px">'+esc(d.meaning)+'</textarea>')+
    field('Source link','<input id="duS" type="url" class="inp" data-bind="d.source" value="'+esc(d.source)+'" placeholder="https://www.alislam.org/…">')+
    field('Recite how many times','<input id="duN" class="inp tnum" inputmode="numeric" data-bind="d.target" value="'+esc(d.target)+'">');
  if(d.err)s+='<div class="err">'+esc(d.err)+'</div>';
  return s+'<button class="btn gold" data-a="duaSave">Save dua</button>'+(d.id?'<button class="btn danger sm" data-a="duaDelete">Delete dua</button>':'')+'<div class="small muted">Duas are shared with Natascha. Each of you keeps your own counts.</div>'}

/* ---------- FAITH: ACTIONS ---------- */
var MOSQUE_SAMPLE="Assalamo Alaikum. Masjid Mubarak prayer timings from Monday 2nd November:\nFajr 5:45am\nZuhr & Asr 1:15pm\nMaghrib: Sunset\nIsha 7:15pm\nJumu'ah 1:15pm\nJazakallah";
function logPrayer(date,p,t,place,comb){S.faith.logs=S.faith.logs.filter(function(l){return !(l.date===date&&(l.p===p||(comb&&l.p===comb)))});
  S.faith.logs.push({id:uid(),date:date,p:p,t:t,place:place||'home',comb:comb||null});if(comb)S.faith.logs.push({id:uid(),date:date,p:comb,t:t,place:place||'home',comb:p})}
function prSheet(date,p){var l=prLog(date,p),w=windows(date)[p],t=today(),def=date===t&&nowMin()>=w.s?nowMin():w.s+15;
  openSheet('prayer',{date:date,p:p,t:mm((l?l.t:def)%1440),place:l?l.place:'home',comb:l?!!l.comb:false},(l?'Edit ':'Log ')+pName(p,date))}
var FA={
  faithView:function(el){ui.faithView=el.dataset.v;render();window.scrollTo(0,0)},
  faithDay:function(el){var v=+el.dataset.v;if(!v){ui.faithDate=null;render();return}var n=addDays(ui.faithDate||today(),v);ui.faithDate=n>=today()?null:n;render()},
  faithPick:function(el){var v=el.dataset.v;ui.faithDate=v===today()?null:v;render()},
  faithPrimary:function(el){S.faith.settings.primary=el.dataset.v;commit()},
  faithAsr:function(el){S.faith.settings.asr=el.dataset.v;calcCache={};commit('Asr now uses the '+(el.dataset.v==='hanafi'?'Hanafi':'standard')+' calculation')},
  prNow:function(el){var v=el.dataset.v.split('|'),t=nowMin();if(v[0]!==today())t+=1440;logPrayer(v[0],v[1],t,'home');var st=prStatus(v[0],v[1]);commit(pName(v[1],v[0])+' logged at '+mm(nowMin())+' · '+ST[st][0].toLowerCase())},
  prTick:function(el){var v=el.dataset.v.split('|'),d=v[0],p=v[1],w=windows(d)[p],l=prLog(d,p);
    if(l||d!==today()){prSheet(d,p);return}
    if(nowMin()<w.s){toast(pName(p,d)+' starts at '+mm(w.s));render();return}
    var t=nowMin();logPrayer(d,p,t,'home');commit(pName(p,d)+' logged at '+mm(t)+' · '+ST[prStatus(d,p)][0].toLowerCase())},
  prOpen:function(el){var v=el.dataset.v.split('|');prSheet(v[0],v[1])},
  prPlace:function(el){ui.sheet.d.place=el.dataset.v;render()},
  prComb:function(){ui.sheet.d.comb=!ui.sheet.d.comb;render()},
  prSave:function(){var d=ui.sheet.d;if(!d.t){d.err='Enter the time you prayed.';render();return}var t=toMin(d.t);if(d.p==='isha'&&t<12*60)t+=1440;
    if(d.date===today()&&t>nowMin()+1&&t<1440){d.err='That time hasn\'t happened yet.';render();return}
    var pair={zuhr:'asr',asr:'zuhr',maghrib:'isha',isha:'maghrib'}[d.p];var old=prLog(d.date,d.p);if(old&&old.comb&&!d.comb)S.faith.logs=S.faith.logs.filter(function(l){return !(l.date===d.date&&l.p===old.comb&&l.comb===d.p)});
    logPrayer(d.date,d.p,t,d.place,d.comb?pair:null);ui.sheet=null;commit(pName(d.p,d.date)+' logged for '+(d.date===today()?'today':fmt(d.date))+' · '+ST[prStatus(d.date,d.p)][0].toLowerCase())},
  prDelete:function(){var d=ui.sheet.d,l=prLog(d.date,d.p);S.faith.logs=S.faith.logs.filter(function(x){return !(x.date===d.date&&(x.p===d.p||(l&&l.comb&&x.p===l.comb&&x.comb===d.p)))});ui.sheet=null;commit('Log removed')},
  prCombine:function(el){var v=el.dataset.v.split('|'),t=nowMin();logPrayer(today(),v[0],t,'home',v[1]);commit(pName(v[0],today())+' and '+PLAB[v[1]][1]+' logged together at '+mm(t))},
  quranOpen:function(){openSheet('quran',{date:today(),surah:'2',from:'',to:'',rukus:''},'Log recitation')},
  quranSave:function(){var d=ui.sheet.d,n=+d.surah,max=surahVerses(n),f=parseInt(d.from,10),t=parseInt(d.to,10),r=parseInt(d.rukus,10);d.err=null;
    if(!d.date||d.date>today()){d.err='Choose today or an earlier date.';render();return}
    if(!(f>=1&&t>=f&&t<=max)){d.err='Verses must run from 1 to '+max+', with the second number not below the first.';render();return}
    if((n===1||n>=93)&&!(r>0))r=1;
    if(!(r>=1&&r<=100)){d.err='Enter how many rukus you read.';render();return}
    S.faith.quran.push({id:uid(),date:d.date,surah:n,from:f,to:t,rukus:r});ui.sheet=null;commit(plural(r,'ruku')+' of '+SURAHS[n-1][0]+' logged')},
  quranDel:function(el){S.faith.quran=S.faith.quran.filter(function(x){return x.id!==el.dataset.id});commit('Recitation removed')},
  mosqueOpen:function(){openSheet('mosque',{text:'',from:''},'Masjid Mubarak times')},
  mosqueSample:function(){ui.sheet.d.text=MOSQUE_SAMPLE;ui.sheet.d.from='';render()},
  mosqueSave:function(){var d=ui.sheet.d,P=parseMosque(d.text),from=d.from||P.from||today();if(!Object.keys(P.times).length){d.err='No prayer times found in that message.';render();return}
    DB.faith.mosque.push({id:uid(),from:from,times:P.times,raw:d.text,added:today()});ui.sheet=null;commit('Masjid Mubarak times updated from '+fmt(from))},
  duaCat:function(el){ui.duaCat=el.dataset.v;render()},
  duaNew:function(el){openSheet('dua',{cat:el.dataset.v,title:'',arabic:'',translit:'',meaning:'',source:'',target:'33'},'Add a dua')},
  duaEdit:function(el){var x=DB.faith.duas.filter(function(y){return y.id===el.dataset.id})[0];if(!x)return;openSheet('dua',{id:x.id,cat:x.cat,title:x.placeholder?'':x.title,arabic:x.arabic,translit:x.translit,meaning:x.meaning,source:x.source,target:String(x.target)},'Edit dua')},
  duaSave:function(){var d=ui.sheet.d,n=(d.title||'').trim(),tg=parseInt(d.target,10);d.err=null;if(!n){d.err='Give the dua a title.';render();return}if(!(tg>=1&&tg<=10000)){d.err='Enter how many times to recite it.';render();return}
    var src=d.source?normLink(d.source):'';if(src===null){d.err='That source link doesn\'t look right.';render();return}
    var o={cat:d.cat,title:n,arabic:(d.arabic||'').trim(),translit:(d.translit||'').trim(),meaning:(d.meaning||'').trim(),source:src||'',target:tg,placeholder:false};
    if(d.id)Object.assign(DB.faith.duas.filter(function(y){return y.id===d.id})[0],o);else DB.faith.duas.push(Object.assign({id:uid()},o));ui.sheet=null;commit('Saved '+n)},
  duaDelete:function(){var d=ui.sheet.d;confirmBox('Delete this dua?','It is removed for both of you.','Delete',function(){DB.faith.duas=DB.faith.duas.filter(function(y){return y.id!==d.id});ui.sheet=null;commit('Dua deleted')})},
  dhikrOpen:function(el){var id=el.dataset.id,x=DB.faith.duas.filter(function(y){return y.id===id})[0];openSheet('dhikr',{id:id,target:'33'},id==='free'?'Counter':(x?x.title:'Counter'))},
  dhikrTap:function(){var k=today()+'|'+ui.sheet.d.id;S.faith.dhikr[k]=(S.faith.dhikr[k]||0)+1;try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}save();render()},
  dhikrMinus:function(){var k=today()+'|'+ui.sheet.d.id;S.faith.dhikr[k]=Math.max(0,(S.faith.dhikr[k]||0)-1);commit()},
  dhikrReset:function(){delete S.faith.dhikr[today()+'|'+ui.sheet.d.id];commit('Counter reset')},
  dhikrTarget:function(el){ui.sheet.d.target=el.dataset.v;render()}
};

function field(label,inner){return '<label class="field"><span>'+label+'</span>'+inner+'</label>'}
function opts(list,val){return list.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')}
function exOptions(val,placeholder){var s=placeholder?'<option value="">'+placeholder+'</option>':'';GROUPS.forEach(function(g){var l=S.lift.exercises.filter(function(e){return e.group===g[0]});if(l.length)s+='<optgroup label="'+g[1]+'">'+l.map(function(e){return '<option value="'+e.id+'"'+(e.id===val?' selected':'')+'>'+esc(e.name)+'</option>'}).join('')+'</optgroup>'});return s}

  askDeleteWorkout:function(el){var id=el.dataset.id;confirmBox('Delete this workout?','Its sets and any PRs it set will be removed. Your records update automatically.','Delete',function(){S.lift.workouts=S.lift.workouts.filter(function(w){return w.id!==id});ui.sheet=null;commit('Workout deleted')})},

  openFoods:function(){if(ui.sheet&&ui.sheet.type==='food')ui.lastFood=ui.sheet.d;else ui.lastFood=null;openSheet('foods',{name:'',kcal:'',p:'',c:'',f:'',back:!!ui.lastFood})},
  nfEdit:function(el){var f=S.fuel.foods.filter(function(x){return x.id===el.dataset.id})[0];if(!f)return;var d=ui.sheet.d;d.editId=f.id;d.name=f.name;d.kcal=String(f.kcal);d.p=String(f.p||'');d.c=String(f.c||'');d.f=String(f.f||'');d.err=null;render();var b=document.getElementById('sheetBody');if(b)b.scrollTop=0},

  nfDelete:function(el){var id=el.dataset.id,f=S.fuel.foods.filter(function(x){return x.id===id})[0];confirmBox('Delete '+(f?f.name:'this food')+'?','Meals you already logged keep their calories.','Delete',function(){S.fuel.foods=S.fuel.foods.filter(function(x){return x.id!==id});commit('Food deleted')})},
  openProfile:function(){var p=S.fuel.profile;openSheet('profile',{weight:String(p.weight),height:String(p.height),age:String(p.age),sex:p.sex,activity:p.activity,goal:p.goal})},
  pfGoal:function(el){ui.sheet.d.goal=el.dataset.v;render()},

  openWeight:function(){var l=weightsSorted().pop();openSheet('weight',{date:today(),kg:l?String(l.kg):''})},
  saveWeight:function(){var d=ui.sheet.d,k=numIn(d.kg);if(!d.date){d.err='Choose a date.';render();return}if(!(k>=30&&k<=300)){d.err='Enter a weight between 30 and 300 kg.';render();return}
    var ex0=S.fuel.weights.filter(function(x){return x.date===d.date})[0];if(ex0)ex0.kg=k;else S.fuel.weights.push({id:uid(),date:d.date,kg:k});ui.sheet=null;commit('Weight saved')},
  removeWeight:function(el){var id=el.dataset.id;S.fuel.weights=S.fuel.weights.filter(function(x){return x.id!==id});commit('Weight entry removed')},
  /* work */
  workFilter:function(el){ui.work.filter=el.dataset.v;render()},
  workFilterDue:function(el){ui.work.due=el.dataset.v==='soon'?null:el.dataset.v;render()},
  msToggle:function(el){var m=S.work.milestones.filter(function(x){return x.id===el.dataset.id})[0];if(!m)return;m.done=!m.done;m.doneAt=m.done?today():null;
    var p=project(m.projectId);if(p){var q=projStats(p.id);if(q.total&&q.done===q.total&&p.status!=='Done'){p.status='Done';commit('All steps done. Project marked Done.');return}if(!m.done&&p.status==='Done')p.status='In progress'}
    commit(m.done?'Done: '+m.title:'Marked not done')},
  msMove:function(el){var m=S.work.milestones.filter(function(x){return x.id===el.dataset.id})[0];var list=msOf(m.projectId),i=list.indexOf(m),j=i+(+el.dataset.v);if(j<0||j>=list.length)return;var o=list[j].order;list[j].order=m.order;m.order=o;
    list=msOf(m.projectId);list.forEach(function(x,k){x.order=k});commit()},
  msEdit:function(el){var m=S.work.milestones.filter(function(x){return x.id===el.dataset.id})[0];if(!m)return;var p=project(m.projectId);openSheet('task',{id:m.id,bucketId:p.bucketId,projectId:p.id,title:m.title,ownerId:m.ownerId,due:m.due||''},'Edit task')},
  openTask:function(){var bid=ui.tab==='work'&&ui.work.bucketId&&ui.work.screen!=='overview'?ui.work.bucketId:(S.work.buckets[0]||{}).id;
    if(!bid){openSheet('bucket',{name:'',color:'violet'},'Add a bucket first');return}
    openSheet('task',{bucketId:bid,projectId:ui.tab==='work'&&ui.work.screen==='project'?ui.work.projectId:null,title:'',ownerId:'me',due:today()})},
  saveTask:function(){var d=ui.sheet.d,t=(d.title||'').trim();if(!t){d.err='Give the task a name.';render();return}if(!project(d.projectId)){d.err='Choose a project.';render();return}
    if(d.id){var m=S.work.milestones.filter(function(x){return x.id===d.id})[0];if(m.projectId!==d.projectId){m.projectId=d.projectId;m.order=msOf(d.projectId).length}m.title=t;m.ownerId=d.ownerId;m.due=d.due||null;ui.sheet=null;commit('Task updated');return}
    S.work.milestones.push({id:uid(),projectId:d.projectId,title:t,ownerId:d.ownerId,due:d.due||null,done:false,doneAt:null,order:msOf(d.projectId).length});
    var p=project(d.projectId);if(p.status==='Done')p.status='In progress';ui.sheet=null;commit('Task added to '+p.name)},
  askDeleteMs:function(el){var id=el.dataset.id;confirmBox('Delete this task?','This cannot be undone.','Delete',function(){var m=S.work.milestones.filter(function(x){return x.id===id})[0];S.work.milestones=S.work.milestones.filter(function(x){return x.id!==id});if(m)msOf(m.projectId).forEach(function(x,k){x.order=k});ui.sheet=null;commit('Task deleted')})},
  openProject:function(el){var id=el.dataset.id;if(id){var p=project(id);openSheet('project',{id:p.id,name:p.name,desc:p.desc||'',bucketId:p.bucketId,priority:p.priority,status:p.status,due:p.due||'',people:(p.people||[]).slice()},'Edit project')}
    else openSheet('project',{name:'',desc:'',bucketId:el.dataset.v||ui.work.bucketId||S.work.buckets[0].id,priority:'P2',status:'Planning',due:'',people:['me']},'New project')},
  pjPri:function(el){ui.sheet.d.priority=el.dataset.v;render()},
  pjStatus:function(el){ui.sheet.d.status=el.dataset.v;render()},
  pjPerson:function(el){var a=ui.sheet.d.people,v=el.dataset.v,i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);render()},
  saveProject:function(){var d=ui.sheet.d,n=(d.name||'').trim();if(!n){d.err='Give the project a name.';render();return}
    if(d.id){var p=project(d.id);p.name=n;p.desc=d.desc;p.bucketId=d.bucketId;p.priority=d.priority;p.status=d.status;p.due=d.due||null;p.people=d.people;ui.sheet=null;ui.work.bucketId=p.bucketId;commit('Project saved');return}
    var np={id:uid(),bucketId:d.bucketId,name:n,desc:d.desc,priority:d.priority,status:d.status,due:d.due||null,people:d.people};S.work.projects.push(np);
    ui.tab='work';ui.work.screen='project';ui.work.projectId=np.id;ui.work.bucketId=np.bucketId;ui.ms={title:'',ownerId:'me',due:''};ui.sheet=null;save();toast('Project added. Now add its milestones.');render();window.scrollTo(0,0)},
  askDeleteProject:function(el){var id=el.dataset.id,p=project(id);confirmBox('Delete '+p.name+'?','Its '+plural(msOf(id).length,'milestone')+' will be deleted too.','Delete',function(){S.work.projects=S.work.projects.filter(function(x){return x.id!==id});S.work.milestones=S.work.milestones.filter(function(m){return m.projectId!==id});ui.sheet=null;ui.work.screen='bucket';commit('Project deleted');window.scrollTo(0,0)})},
  openBucket:function(el){var id=el.dataset.id;if(id){var b=bucket(id);openSheet('bucket',{id:b.id,name:b.name,color:b.color},'Edit bucket')}else openSheet('bucket',{name:'',color:'green'},'New bucket')},
  bkColor:function(el){ui.sheet.d.color=el.dataset.v;render()},
  saveBucket:function(){var d=ui.sheet.d,n=(d.name||'').trim();if(!n){d.err='Give the bucket a name.';render();return}
    if(d.id){var b=bucket(d.id);b.name=n;b.color=d.color;ui.sheet=null;commit('Bucket saved');return}
    S.work.buckets.push({id:uid(),name:n,color:d.color});ui.sheet=null;commit('Bucket added')},
  askDeleteBucket:function(el){var id=el.dataset.id,b=bucket(id),n=S.work.projects.filter(function(p){return p.bucketId===id}).length;
    if(n){ui.sheet.d.err='Move or delete its '+plural(n,'project')+' first.';render();return}
    confirmBox('Delete '+b.name+'?','The bucket is empty, so nothing else is removed.','Delete',function(){S.work.buckets=S.work.buckets.filter(function(x){return x.id!==id});ui.sheet=null;ui.work.screen='overview';commit('Bucket deleted')})},
  openPeople:function(){var back=ui.sheet&&ui.sheet.type==='project'?ui.sheet.d:null;ui.lastProject=back;openSheet('people',{name:'',back:!!back})},
  backToProject:function(){var d=ui.lastProject;openSheet('project',d,d&&d.id?'Edit project':'New project')},
  ppDelete:function(el){var id=el.dataset.id,p=person(id);confirmBox('Remove '+p.name+'?','Their tasks move to you.','Remove',function(){S.work.people=S.work.people.filter(function(x){return x.id!==id});S.work.milestones.forEach(function(m){if(m.ownerId===id)m.ownerId='me'});S.work.projects.forEach(function(pr){pr.people=(pr.people||[]).filter(function(x){return x!==id})});if(ui.lastProject)ui.lastProject.people=ui.lastProject.people.filter(function(x){return x!==id});commit('Removed '+p.name)})},
  /* more */
  toggleRem:function(el){var k=el.dataset.k;S.settings.reminders[k]=!S.settings.reminders[k];commit()},
  previewReminder:function(){var t=today(),due=S.work.milestones.filter(function(m){return !m.done&&m.due===t}),od=S.work.milestones.filter(function(m){return !m.done&&m.due&&m.due<t});
    var b=due.length?{title:plural(due.length,'task')+' due today',body:due.slice(0,3).map(function(m){return m.title}).join(' · ')}:(od.length?{title:plural(od.length,'task')+' overdue',body:od.slice(0,3).map(function(m){return m.title}).join(' · ')}:{title:'Nothing due today',body:'Enjoy the clear day.'});
    ui.banner=b;clearTimeout(bannerT);bannerT=setTimeout(function(){ui.banner=null;render()},6000);render()},
  openExport:function(){openSheet('export',{})},
  copyExport:function(){var ta=document.getElementById('exportTxt'),txt=ta?ta.value:JSON.stringify(S);
    function fallback(){if(ta){ta.focus();ta.select()}toast('Selected. Press copy on your keyboard or menu.')}
    try{navigator.clipboard.writeText(txt).then(function(){toast('Copied to clipboard')},fallback)}catch(e){fallback()}},
  openImport:function(){openSheet('import',{text:''})},
  doImport:function(){var d=ui.sheet.d,v;try{v=JSON.parse(d.text)}catch(e){d.err='That is not valid backup text. Paste the whole export, from the first { to the last }.';render();return}
    if(validDB(v)){DB=v;useUser(v.active)}else if(valid(v)){DB.users[DB.active]={settings:v.settings,lift:v.lift,fuel:v.fuel,work:v.work};if(v.meal)DB.meal=v.meal;useUser(DB.active)}else{d.err='This file is not a Life Organiser backup.';render();return}ensureMeal();applyTheme();ui.sheet=null;ui.tab='home';commit('Backup imported');window.scrollTo(0,0)},
  askReset:function(){confirmBox('Reload sample data?','Everything you changed will be replaced by the examples.','Reload',function(){DB=seedDB();useUser('daniyal');ensureMeal();applyTheme();ui.expanded={};ui.mealScreen='plan';ui.mealDraft=null;ui.mealWeek=null;ui.work={screen:'overview',filter:'all'};ui.tab='home';commit('Sample data loaded');window.scrollTo(0,0)})},
  askFresh:function(){confirmBox('Start fresh?','Workouts, food logs, weights, meal plans, calendar blocks, projects and tasks are cleared. Your libraries, meals, profile, buckets and people stay.','Clear',function(){S.cal.blocks=[];S.faith.logs=[];S.faith.quran=[];S.faith.dhikr={};S.meal.plan={};S.meal.shop={done:{},edit:{},extra:{}};S.lift.workouts=[];S.fuel.log=[];S.fuel.weights=[];S.work.projects=[];S.work.milestones=[];ui.work={screen:'overview',filter:'all'};commit('Cleared. Ready for your own data.')})}
};

/* forms submitted with Enter or a submit button */
var FORMS={
  addMs:function(){var d=ui.ms,t=(d.title||'').trim();if(!t){d.err='Type a milestone first.';render();return}d.err=null;var pid=ui.work.projectId;
    S.work.milestones.push({id:uid(),projectId:pid,title:t,ownerId:d.ownerId||'me',due:d.due||null,done:false,doneAt:null,order:msOf(pid).length});
    var p=project(pid);if(p.status==='Done')p.status='In progress';ui.ms={title:'',ownerId:d.ownerId,due:''};commit('Milestone added');var i=document.getElementById('msTitle');if(i)i.focus()},
  saveFoodItem:function(){var d=ui.sheet.d,n=(d.name||'').trim(),k=numIn(d.kcal);if(!n){d.err='Give the food a name.';render();return}if(!(k>=0)){d.err='Enter calories per serving.';render();return}
    var vals={name:n,kcal:Math.round(k),p:numIn(d.p)||0,c:numIn(d.c)||0,f:numIn(d.f)||0};
    if(d.editId){var f=S.fuel.foods.filter(function(x){return x.id===d.editId})[0];Object.assign(f,vals);d.editId=null}else S.fuel.foods.unshift(Object.assign({id:uid()},vals));
    d.name=d.kcal=d.p=d.c=d.f='';d.err=null;commit('Saved '+n)},
  addExercise:function(){var d=ui.sheet.d,n=(d.name||'').trim();if(!n){d.err='Name the exercise.';render();return}if(S.lift.exercises.some(function(e){return e.name.toLowerCase()===n.toLowerCase()})){d.err='That exercise is already in your library.';render();return}
    S.lift.exercises.push({id:uid(),name:n,group:d.group,custom:true});d.name='';d.err=null;commit('Added '+n)},
  addPerson:function(){var d=ui.sheet.d,n=(d.name||'').trim();if(!n){d.err='Type a name.';render();return}var np={id:uid(),name:n};S.work.people.push(np);if(ui.lastProject)ui.lastProject.people.push(np.id);d.name='';d.err=null;commit('Added '+n)}
};

for(var mk in MA)A[mk]=MA[mk];for(var ck in CA)A[ck]=CA[ck];for(var fk2 in FA)A[fk2]=FA[fk2];for(var fk in MF)FORMS[fk]=MF[fk];

/* ---------- events ---------- */
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||el.disabled)return;var fn=A[el.dataset.a];if(Date.now()-calSup<350){e.preventDefault();return}if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var fn=FORMS[f.dataset.form];if(fn)fn()});
document.addEventListener('input',function(e){var el=e.target;if(!el.dataset||!el.dataset.bind)return;setPath(el.dataset.bind,el.value);if(el.dataset.live!==undefined)render()});
document.addEventListener('change',function(e){var el=e.target;if(!el.dataset)return;
  if(el.dataset.ch==='chartEx'){ui.chartEx=el.value;render();return}
  if(el.dataset.ch==='wAddEx'){A.wAddEx(el);return}
  if(el.dataset.ch==='importFile'){var f=el.files&&el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ui.sheet.d.text=String(r.result||'');ui.sheet.d.err=null;render()};r.readAsText(f);return}
  if(el.dataset.bind&&el.tagName==='SELECT'){setPath(el.dataset.bind,el.value);if(el.dataset.live!==undefined)render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(ui.confirm){ui.confirm=null;render()}else if(ui.sheet){ui.sheet=null;render()}}});
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.settings.theme==='system')render()})}catch(e){}}

DB=loadDB();useUser(DB.active);ensureMeal();save();applyTheme();render();
})();
</script>
